# vim: ft=kitty

shell zsh

# Font
# font_family      Iosevka SS07 small # Medium
# bold_font        Iosevka SS07 Bold
# italic_font      Iosevka SS07 Medium Italic
# bold_italic_font Iosevka SS07 Bold Italic

font_family      JetBrainsMono Nerd Font 
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 9.4
adjust_line_height  1
adjust_column_width 1
modify_font underline_thickness 150%
modify_font underline_position 10
undercurl_style thick-sparse
open_url_with helium-browser

# Window
background_opacity 0.4 
#background_blur 90
dynamic_background_opacity yes
#window_padding_width 2 
hide_window_decorations no
confirm_os_window_close 0
remember_window_size yes

# Cursor
cursor_shape beam

# Bell
enable_audio_bell no

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template {title.split()[0]}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Mappings
map alt+a new_tab_with_cwd
map ctrl+shift+h no_op
map ctrl+shift+l no_op

# Misc
editor nvim

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# include $HOME/.cache/wal/colors-kitty.conf
# END_KITTY_THEME
